# ---------------------------------------------------------------------------
# P3WIN — Gradle configuration (Phase 0)
# ---------------------------------------------------------------------------
# AndroidX / R-class behaviour of the Winlator 11.2 core. Do not touch before
# the base APK is verified: the core Java sources rely on non-final R fields
# and on transitive R classes.
android.useAndroidX=true
android.enableJetifier=true
android.nonFinalResIds=false
android.nonTransitiveRClass=false

# compileSdk 35 comes from the upstream Winlator 11.2 build script, while the
# Android Gradle Plugin is pinned to 8.4.2 (max tested API = 34). The warning is
# expected and harmless; it is suppressed here so that the Phase 0 build log
# stays clean (project rule #2: no noisy warning soup).
# Revisit when AGP is bumped in Phase 1 together with a compileSdk bump.
android.suppressUnsupportedCompileSdk=35

# Keep the Gradle daemon out of the memory pressure zone on a 16 GB dev box
# while CMake builds 6 native modules in parallel.
org.gradle.jvmargs=-Xmx4096m -Dfile.encoding=UTF-8
# Ninja/CMake native builds (androideabi) are the heavy part of this project.
org.gradle.parallel=true
org.gradle.caching=true
